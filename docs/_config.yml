title: Agent Orchestrator
description: Open-source platform for orchestrating parallel AI coding agents — agent-agnostic, runtime-agnostic, tracker-agnostic.
theme: just-the-docs

url: https://composio.github.io
baseurl: /agent-orchestrator

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: true
  focus_shortcut_key: "k"

# Navigation
nav_enabled: true

# Top-right links
aux_links:
  "View on GitHub":
    - "https://github.com/ComposioHQ/agent-orchestrator"
aux_links_new_tab: true

# Theme
color_scheme: light
heading_anchors: true

# Callouts
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: purple

# Exclude legacy and non-doc files from Jekyll build
exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - ".archive/"
  - "project-scan-report.json"
  # Legacy developer docs (superseded by new pages)
  - "DEVELOPMENT.md"
  - "SETUP-GUIDE.md"
  - "development-guide.md"
  - "architecture.md"
  - "integration-architecture.md"
  - "source-tree-analysis.md"
  - "api-contracts.md"
  - "component-inventory.md"
  - "project-overview.md"
  - "INTEGRATION-GUIDE.md"
  - "SCALING-STRATEGIES.md"
  - "SECURITY-AUDIT-SUMMARY.md"
  - "TESTING-CONVENTIONS.md"
  - "PLUGIN-DEVELOPMENT.md"
  - "file-locking.md"
  - "design/"
  - "product_docs/"
